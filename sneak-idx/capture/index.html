<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact the real estate team</title><style>
*{box-sizing:border-box}body{margin:0;padding:22px;font:16px/1.5 system-ui,sans-serif;color:#334155;background:white}h1{font-size:25px;margin:0 0 8px}label{display:block;margin-top:12px}input,textarea,select,button{font:inherit;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:5px}button{margin-top:16px;background:#334155;color:white;cursor:pointer}a{color:#0369a1}small{display:block;margin:12px 0;color:#64748b}.trap{position:absolute;left:-10000px}#status{margin-top:12px}button:disabled{opacity:.6}
</style></head><body><h1 id="heading">How can we help?</h1><p id="team">Ask about a property, request a tour, or speak with an agent.</p><form id="form">
<label>Name<input id="name" required maxlength="100" autocomplete="name"></label><label>Email<input id="email" type="email" required maxlength="150" autocomplete="email"></label><label>Phone (optional)<input id="phone" type="tel" maxlength="30" autocomplete="tel"></label><label>I would like to<select id="intent"><option value="general">Learn more / contact the team</option><option value="property_inquiry">Ask about a property</option><option value="schedule_tour">Schedule a tour</option></select></label><label>Message<textarea id="message" maxlength="2000" rows="3"></textarea></label><label class="trap" aria-hidden="true">Website<input id="companyWebsite" tabindex="-1" autocomplete="off"></label><small>Your contact details and request will be shared with this website’s real estate team so they can respond.</small><button id="submit" type="submit">Send request</button><div id="status" role="status"></div></form><hr><p>Save homes and keep track of your search.</p><a id="signin" target="_blank" rel="noopener">Create an account / Sign in securely</a>
<script>
const params=new URLSearchParams(location.search),site=params.get('site'),session=params.get('session');
params.delete('session');history.replaceState(null,'',location.pathname+'?'+params.toString());
const auth={'Content-Type':'application/json','Authorization':'Bearer '+session};
document.getElementById('signin').href='/portal?site='+encodeURIComponent(site)+'&signin=1';
fetch('/idx/v1/config?site='+encodeURIComponent(site),{headers:auth}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(cfg=>{document.getElementById('team').textContent='Contact '+(cfg.displayName||'the real estate team')+'. Ask about a home, schedule a tour, or tell us what you are looking for.';}).catch(()=>{document.getElementById('status').textContent='Unable to load this contact form. Please close and reopen it.';document.getElementById('submit').disabled=true;});
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Sending…';try{const r=await fetch('/idx/v1/lead?site='+encodeURIComponent(site),{method:'POST',headers:auth,body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,message:document.getElementById('message').value,leadType:document.getElementById('intent').value,companyWebsite:document.getElementById('companyWebsite').value,listingKey:params.get('listingKey')||null})});const data=await r.json();if(!r.ok)throw Error(data.message||'Unable to send your request.');e.target.reset();status.textContent='Thank you. Your request has been sent to the real estate team.';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></body></html>
