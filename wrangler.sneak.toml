name = "sneak-idx-worker-staging"
main = "SneakIDXWorker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SNEAK_ENV = "staging"

[secrets]
required = ["SNEAK_SIGNING_SECRET"]

[assets]
directory = "./sneak-idx"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sneak-idx-staging"
database_id = "6b91eeca-d65f-434c-a49f-419dff98285f"
migrations_dir = "migrations"

# Scheduled cron jobs for Bridge MLS sync (Disabled for initial staging deployment)
# [triggers]
# crons = ["0 */2 * * *", "*/15 * * * *"]
