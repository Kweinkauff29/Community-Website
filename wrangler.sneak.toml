name = "sneak-idx-worker"
main = "SneakIDXWorker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SNEAK_ENV = "staging"

[assets]
directory = "./sneak-idx"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "community-idx"
database_id = "9940be0f-a4be-4835-81f7-09a52d42f7a9"
migrations_dir = "migrations"

[triggers]
crons = ["0 */2 * * *", "*/15 * * * *"]
