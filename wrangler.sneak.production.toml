name = "sneak-idx-worker"
main = "SneakIDXWorker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SNEAK_ENV = "production"
CONSUMER_WORKER_URL = "https://sneak-idx-consumer.bonitaspringsrealtors.workers.dev"
CONSUMER_AUTH_ENABLED = "false"
EMAIL_ALERTS_ENABLED = "false"

[assets]
directory = "./sneak-idx"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sneak-idx-production"
database_id = "9d3c529d-a769-4ab3-9385-d9c8bc5e937d"
migrations_dir = "migrations"
