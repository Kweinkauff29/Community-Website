# wrangler.sneak-alerts.toml
# Dedicated Configuration for SNEAK IDX Saved Search Email Alert Worker

name = "sneak-idx-alerts-staging"
main = "sneak-alerts/worker.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SNEAK_ENV = "staging"
ALERTS_WORKER_URL = "https://sneak-idx-alerts-staging.bonitaspringsrealtors.workers.dev"
EMAIL_FROM = "CCOR Property Search <no-reply@ccorealtors.org>"

[[d1_databases]]
binding = "DB"
database_name = "sneak-idx-staging"
database_id = "6b91eeca-d65f-434c-a49f-419dff98285f"
migrations_dir = "migrations"

[triggers]
crons = [
  "10,25,40,55 * * * *"
]
