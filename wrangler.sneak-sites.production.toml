name = "sneak-idx-sites"
main = "sneak-sites/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SNEAK_ENV = "production"
SNEAK_SERVICE_NAME = "sneak-idx-sites"
SNEAK_SERVING_URL = "https://sneak-idx-worker.bonitaspringsrealtors.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "sneak-idx-production"
database_id = "9d3c529d-a769-4ab3-9385-d9c8bc5e937d"
migrations_dir = "migrations"

# PILOT-01 uses an embed on the existing member website; no custom-host route is enabled.
